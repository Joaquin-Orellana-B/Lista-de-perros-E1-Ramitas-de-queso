name: CI/CD Pipeline - Lista de Perros

on:
  push:
    branches: [ "main", "develop_JO" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Validar estructura del proyecto (Pruebas estáticas)
    - name: Verificar archivos clave
      run: |
        echo "Comprobando existencia de archivos..."
        test -f index.html || exit 1
        test -f index.js || exit 1
        test -f style.css || exit 1
        test -f Dockerfile || exit 1
        echo "¡Todos los archivos requeridos están presentes!"

    # 3. Construir la imagen Docker (IE1)
    - name: Construir Imagen Docker
      run: |
        docker build -t lista-de-perros:latest .

    # 4. Despliegue simulado y prueba de integración (IE2 e IE4)
    - name: Despliegue simulado y prueba de funcionamiento
      run: |
        docker run -d -p 8080:80 --name app-test lista-de-perros:latest
        sleep 3
        curl -f http://localhost:8080 || exit 1
        docker stop app-test